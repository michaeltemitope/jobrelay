default_install_hook_types: [pre-commit, commit-msg]

repos:
  - repo: local
    hooks:
      - id: staged-whitespace
        name: Check staged whitespace
        entry: git diff --cached --check
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-commit]
      - id: conventional-commit
        name: Check Conventional Commit subject
        entry: bash scripts/check-commit-message.sh
        language: system
        stages: [commit-msg]
